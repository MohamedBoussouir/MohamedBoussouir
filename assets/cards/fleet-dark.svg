<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Fleet Flow API — api rest · node.js / express</title>
  <desc id="dsc">API de gestion de flotte de transport : camions, trajets, carburant, maintenance.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#34D399" stop-opacity=".22"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="600" height="300" rx="18"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="600" height="300" rx="18" fill="#101B2F" filter="url(#shadow)"/>
  <g clip-path="url(#card)">
    <circle cx="560" cy="10" r="190" fill="url(#glow)"/>
    <rect width="600" height="3" fill="url(#bar)"/>
  </g>
  <rect x=".5" y=".5" width="599" height="299" rx="17.5" fill="none" stroke="#1E293B"/>

  <!-- icône -->
  <rect x="32" y="34" width="42" height="42" rx="11" fill="#34D3991A" stroke="#34D399" stroke-opacity=".28"/>
  <g transform="translate(43 45) scale(0.833)" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/>
  </g>

  <!-- textes -->
  <text x="90" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-.6" fill="#F1F5F9">Fleet Flow API</text>
  <text x="91" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.9" fill="#34D399">API REST · NODE.JS / EXPRESS</text>

  <text x="32" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94A3B8">API de gestion de flotte de transport :</text>
  <text x="32" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94A3B8">camions, trajets, carburant, maintenance.</text>

  <rect x="32.0" y="200" width="80.6" height="28" rx="14.0" fill="#17253D" stroke="none"/>
  <text x="72.3" y="218.6" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#CBD5E1">Express</text>
  <rect x="120.6" y="200" width="80.6" height="28" rx="14.0" fill="#17253D" stroke="none"/>
  <text x="160.9" y="218.6" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#CBD5E1">MongoDB</text>
  <rect x="209.2" y="200" width="49.4" height="28" rx="14.0" fill="#17253D" stroke="none"/>
  <text x="233.9" y="218.6" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#CBD5E1">JWT</text>
  <rect x="266.6" y="200" width="72.8" height="28" rx="14.0" fill="#17253D" stroke="none"/>
  <text x="303.0" y="218.6" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#CBD5E1">Docker</text>

  <text x="32" y="270" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#64748B">@MohamedBoussouir/fleet-flow-api</text>
  <text x="568" y="270" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#22D3EE">VOIR LE DÉPÔT ↗</text>

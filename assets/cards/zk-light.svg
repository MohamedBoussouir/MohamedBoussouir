<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">HS ZK Attendance — application desktop · electron</title>
  <desc id="dsc">Pointage biométrique ZKTeco SenseFace 2A : sync, plannings et licences AES-256.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/><stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#059669" stop-opacity=".08"/><stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="600" height="300" rx="18"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="600" height="300" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <g clip-path="url(#card)">
    <circle cx="560" cy="10" r="190" fill="url(#glow)"/>
    <rect width="600" height="3" fill="url(#bar)"/>
  </g>
  <rect x=".5" y=".5" width="599" height="299" rx="17.5" fill="none" stroke="#E2E8F0"/>

  <!-- icône -->
  <rect x="32" y="34" width="42" height="42" rx="11" fill="#05966914" stroke="#059669" stroke-opacity=".28"/>
  <g transform="translate(43 45) scale(0.833)" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
  </g>

  <!-- textes -->
  <text x="90" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-.6" fill="#0F172A">HS ZK Attendance</text>
  <text x="91" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.9" fill="#059669">APPLICATION DESKTOP · ELECTRON</text>

  <text x="32" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569">Pointage biométrique ZKTeco SenseFace 2A :</text>
  <text x="32" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569">sync, plannings et licences AES-256.</text>

  <rect x="32.0" y="200" width="88.4" height="28" rx="14.0" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="76.2" y="218.6" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Electron</text>
  <rect x="128.4" y="200" width="72.8" height="28" rx="14.0" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="164.8" y="218.6" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">SQLite</text>
  <rect x="209.2" y="200" width="72.8" height="28" rx="14.0" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="245.6" y="218.6" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">ZKTeco</text>
  <rect x="290.0" y="200" width="72.8" height="28" rx="14.0" fill="#F1F5F9" stroke="#E2E8F0"/>

  <text x="568" y="270" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#0891B2">VOIR LE DÉPÔT ↗</text>

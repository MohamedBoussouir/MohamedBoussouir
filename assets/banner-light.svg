<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Mohammed Boussouir — Développeur Full Stack</title>
  <desc id="dsc">Bannière de profil : Mohammed Boussouir, développeur full stack MERN et Laravel, ouvert aux opportunités.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F7FB"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="680" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/><stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669" stop-opacity=".0"/>
      <stop offset=".25" stop-color="#059669"/>
      <stop offset=".75" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop stop-color="#0891B2" stop-opacity=".08"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop stop-color="#059669" stop-opacity=".08"/><stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#CBD5E1" fill-opacity=".32"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
    <clipPath id="term"><rect x="704" y="64" width="432" height="272" rx="16"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <style>
      .tl { }
      .tl-1 { animation: rise .55s cubic-bezier(.2,.7,.3,1) .05s both; }
      .tl-2 { animation: rise .55s cubic-bezier(.2,.7,.3,1) .20s both; }
      .tl-3 { animation: rise .55s cubic-bezier(.2,.7,.3,1) .35s both; }
      .tl-4 { animation: rise .55s cubic-bezier(.2,.7,.3,1) .50s both; }
      .tl-5 { animation: rise .55s cubic-bezier(.2,.7,.3,1) .65s both; }
      .tl-6 { animation: rise .55s cubic-bezier(.2,.7,.3,1) .80s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
      .halo { animation: halo 9s ease-in-out infinite; }
      @keyframes halo { 0%, 100% { opacity: .8 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        .tl-1, .tl-2, .tl-3, .tl-4, .tl-5, .tl-6, .cursor, .halo { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <circle class="halo" cx="1080" cy="30" r="360" fill="url(#glowA)"/>
    <circle class="halo" cx="90" cy="400" r="330" fill="url(#glowB)"/>
    <rect y="398" width="1200" height="2" fill="url(#bar)" opacity=".9"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="19.5" fill="none" stroke="#E2E8F0"/>

  <!-- pastille de disponibilité -->
  <g>
    <rect x="72" y="60" width="283" height="34" rx="17" fill="#05966914" stroke="#059669" stroke-opacity=".35"/>
    <circle cx="94" cy="77" r="8" fill="#059669" fill-opacity=".16"/>
    <circle cx="94" cy="77" r="3.6" fill="#059669"/>
    <text x="108" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.1" fill="#059669">OUVERT AUX OPPORTUNITÉS</text>
  </g>

  <!-- identité -->
  <text x="72" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.6" fill="#0B1220">Mohammed Boussouir</text>
  <text x="72" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3.3" fill="url(#accent)">DÉVELOPPEUR FULL STACK · MERN &amp; LARAVEL</text>

  <text x="72" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#475569">Je construis des applications web &amp; desktop complètes,</text>
  <text x="72" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#475569">de l’interface React jusqu’au déploiement Docker.</text>

  <!-- méta -->
  <g transform="translate(72,322)">
    <path d="M8 0C3.6 0 0 3.6 0 8c0 6 8 14 8 14s8-8 8-14c0-4.4-3.6-8-8-8zm0 11a3 3 0 110-6 3 3 0 010 6z" fill="#64748B"/>
    <text x="26" y="14" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#64748B">Agadir · Maroc</text>
  </g>
  <g transform="translate(214,322)">
    <path d="M12 3 1 8l11 5 8-3.6V17h2V8L12 3zM5 11.5V15c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.5l-7 3.2-7-3.2z" fill="#64748B"/>
    <text x="30" y="14" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#64748B">YouCode — UM6P, Campus Youssoufia</text>
  </g>

  <!-- terminal -->
  <g>
    <rect x="716" y="80" width="432" height="272" rx="16" fill="#000" opacity=".12" filter="url(#soft)"/>
    <rect x="704" y="64" width="432" height="272" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <g clip-path="url(#term)">
      <rect x="704" y="64" width="432" height="44" fill="#F8FAFC"/>
      <circle cx="726" cy="86" r="4.5" fill="#F87171" fill-opacity=".85"/>
      <circle cx="742" cy="86" r="4.5" fill="#FBBF24" fill-opacity=".85"/>
      <circle cx="758" cy="86" r="4.5" fill="#34D399" fill-opacity=".85"/>
      <text x="1120" y="90" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748B">mohammed@youcode — ~/dev</text>
      <line x1="704" y1="108" x2="1136" y2="108" stroke="#E2E8F0"/>

      <text class="tl-1" x="726" y="148" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#334155"><tspan fill="#64748B">~/dev</tspan><tspan fill="#059669">&#160;$&#160;</tspan>whoami</text>
      <text class="tl-2" x="726" y="176" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#475569">mohammed — développeur full stack</text>
      <text class="tl-3" x="726" y="204" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#334155"><tspan fill="#64748B">~/dev</tspan><tspan fill="#059669">&#160;$&#160;</tspan>ls stack/</text>
      <text class="tl-4" x="726" y="232" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#475569">react · node · laravel · electron</text>
      <text class="tl-5" x="726" y="260" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#334155"><tspan fill="#64748B">~/dev</tspan><tspan fill="#059669">&#160;$&#160;</tspan>git status</text>
      <g class="tl-6">
        <circle cx="730" cy="284" r="3.6" fill="#059669"/>
        <text x="742" y="288" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#059669" textLength="256" lengthAdjust="spacing">branch main — prêt à collaborer</text>
        <rect class="cursor" x="1006" y="277" width="8" height="15" rx="2" fill="#059669"/>
      </g>
    </g>
  </g>
</svg>
